<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABT Tag &amp; Title Worksheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  :root{
    --bg:#14181c;
    --panel:#1b2126;
    --panel-2:#232a31;
    --line:#31393f;
    --text:#e9edf0;
    --text-soft:#8a949c;
    --amber:#f5a623;
    --amber-dim:rgba(245,166,35,0.14);
    --ok:#3ecf7e;
    --ok-dim:rgba(62,207,126,0.12);
    --warn:#ef7b5f;
    --warn-dim:rgba(239,123,95,0.12);
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #1c232a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 16px 60px;
  }
  .sheet{
    max-width:760px;
    margin:0 auto;
  }
  .letterhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .letterhead .eyebrow{
    font-family:var(--mono);
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:4px;
  }
  .letterhead h1{
    margin:0;
    font-size:1.55rem;
    font-weight:600;
    letter-spacing:-0.2px;
    color:var(--text);
  }
  .stamp{
    font-family:var(--mono);
    font-size:0.65rem;
    font-weight:600;
    letter-spacing:1px;
    color:var(--warn);
    border:1px solid var(--warn);
    border-radius:3px;
    padding:4px 9px;
    white-space:nowrap;
  }
  .disclaimer{
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--text-soft);
    border-left:2px solid var(--amber);
    padding:8px 12px;
    margin:18px 0 22px;
    background:var(--amber-dim);
    line-height:1.55;
    border-radius:0 3px 3px 0;
  }
  fieldset{
    border:none;
    border-top:1px solid var(--line);
    padding:16px 0;
    margin:0;
  }
  legend{
    font-family:var(--mono);
    font-size:0.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-soft);
    padding:0 8px 0 0;
  }
  .row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-top:10px;
  }
  .field{
    flex:1 1 200px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field.checkline{
    flex-direction:row;
    align-items:center;
    gap:9px;
    flex:1 1 auto;
  }
  label{
    font-size:0.76rem;
    color:var(--text-soft);
    font-family:var(--sans);
    font-weight:500;
  }
  input[type=number], input[type=date], select{
    font-family:var(--mono);
    font-size:0.92rem;
    padding:8px 9px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    border-radius:5px;
    outline:none;
  }
  input[type=number]:focus, input[type=date]:focus, select:focus{
    border-color:var(--amber);
  }
  input[type=checkbox]{
    width:17px;height:17px;
    accent-color:var(--amber);
  }
  .hint{
    font-size:0.7rem;
    color:var(--text-soft);
    opacity:0.85;
    margin-top:1px;
    line-height:1.4;
  }
  .info-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    cursor:help;
    vertical-align:middle;
  }
  .info-icon{
    width:14px;height:14px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--text-soft);
    color:var(--text-soft);
    font-size:0.62rem;
    font-family:var(--mono);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:5px;
    flex-shrink:0;
  }
  .info-wrap:hover .info-icon{
    border-color:var(--amber);
    color:var(--amber);
  }
  .info-tooltip{
    visibility:hidden;
    opacity:0;
    position:absolute;
    bottom:135%;
    left:0;
    width:250px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-weight:400;
    font-size:0.72rem;
    line-height:1.45;
    padding:9px 11px;
    border-radius:6px;
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
    z-index:20;
    transition:opacity 0.12s ease;
    pointer-events:none;
  }
  .info-wrap:hover .info-tooltip{
    visibility:visible;
    opacity:1;
  }
  .result{
    margin-top:24px;
    border:1px solid var(--amber);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(245,166,35,0.08), 0 8px 30px rgba(0,0,0,0.35);
  }
  .result-head{
    background:var(--panel-2);
    color:var(--amber);
    font-family:var(--mono);
    font-size:0.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:10px 14px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .result-body{
    padding:16px 18px;
    background:var(--panel);
  }
  .line{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:0.87rem;
    padding:5px 0;
    border-bottom:1px dotted var(--line);
    color:var(--text);
  }
  .line.sub{
    padding-left:14px;
    color:var(--text-soft);
    font-size:0.79rem;
  }
  .line.total{
    border-bottom:none;
    border-top:1px solid var(--amber);
    margin-top:8px;
    padding-top:12px;
    font-size:1.25rem;
    font-weight:600;
    color:var(--amber);
  }
  .flag{
    margin-top:12px;
    font-family:var(--mono);
    font-size:0.74rem;
    color:var(--warn);
    background:var(--warn-dim);
    padding:8px 11px;
    border-radius:5px;
    line-height:1.5;
  }
  .flag.ok{
    color:var(--ok);
    background:var(--ok-dim);
  }
  .footnote{
    font-family:var(--mono);
    font-size:0.66rem;
    color:var(--text-soft);
    margin-top:20px;
    line-height:1.65;
    border-top:1px solid var(--line);
    padding-top:12px;
  }

  /* Mobile */
  @media (max-width: 600px){
    body{ padding:18px 10px 50px; }
    .letterhead{ flex-direction:column; align-items:flex-start; gap:10px; }
    .letterhead h1{ font-size:1.3rem; }
    .stamp{ align-self:flex-start; }
    .row{ gap:12px; }
    .field, .field.checkline{ flex:1 1 100%; }
    input[type=number], input[type=date], select{
      font-size:16px; /* prevents iOS auto-zoom on focus */
      width:100%;
      padding:11px 10px;
    }
    input[type=checkbox]{
      width:20px; height:20px; flex-shrink:0;
    }
    .field.checkline label{ font-size:0.9rem; }
    .line{ font-size:0.82rem; }
    .line.total{ font-size:1.15rem; }
    .result-head{ font-size:0.68rem; }
    legend{ font-size:0.64rem; }
  }
  /* Print */
  @media print {
    @page { size: letter; margin: 0.35in; }
    body{
      background: #fff !important;
      color: #000 !important;
      padding: 0;
      font-size: 9.5px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet{ max-width: 100%; }
    .letterhead{ border-bottom-color: #000; padding-bottom: 6px; margin-bottom: 2px; }
    .letterhead h1{ color: #000; font-size: 1.1rem; }
    fieldset{ border-top-color: #ccc; padding: 6px 0; }
    legend{ color: #000; font-size: 8px; }
    .row{ gap: 8px; margin-top: 5px; }
    label{ color: #444; font-size: 7.5px; }
    input[type=number], input[type=date], select{
      border-color: #999;
      background: #fafafa !important;
      color: #000 !important;
      font-size: 9px;
      padding: 3px 5px;
    }
    .hint{ display: none; } /* skip instructional text on a printed record */
    .info-wrap{ display: none; }
    .result{
      border-color: #000;
      box-shadow: none;
      margin-top: 10px;
      break-inside: avoid;
    }
    .result-head{
      background: #eee !important;
      color: #000 !important;
      border-bottom-color: #000;
      font-size: 8px;
      padding: 5px 8px;
    }
    .result-body{ background: #fff !important; padding: 8px 10px; }
    .line{ color: #000; border-bottom-color: #ddd; font-size: 9px; padding: 2px 0; }
    .line.sub{ color: #555; font-size: 8px; }
    .line.total{ color: #000; border-top-color: #000; font-size: 1rem; padding-top: 6px; margin-top: 4px; }
    .flag{ color: #000; background: #f5f5f5 !important; font-size: 7.5px; padding: 4px 7px; }
    .flag.ok{ background: #f5f5f5 !important; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="letterhead">
    <div>
      <h1>Tag &amp; Title Worksheet</h1>
    </div>
  </div>

  <fieldset>
    <legend>Vendor</legend>
    <div class="row">
      <div class="field checkline">
        <input type="checkbox" id="includeSunstate" checked>
        <label for="includeSunstate" style="font-size:0.85rem;">Include Sunstate $10 service fee</label>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Vehicle</legend>
    <div class="row">
      <div class="field">
        <label for="netwt">Net (curb) weight, lbs</label>
        <input type="number" id="netwt" placeholder="e.g. 6200">
      </div>
      <div class="field">
        <label for="gvw">GVW, lbs</label>
        <input type="number" id="gvw" placeholder="e.g. 9600">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Buyer</legend>
    <div class="row">
      <div class="field">
        <label for="ownertype">Owner type</label>
        <select id="ownertype">
          <option value="individual">Individual</option>
          <option value="business">Business</option>
        </select>
      </div>
      <div class="field" id="bdayfield">
        <label for="bday">Owner birthday (month/day)<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">Only matters for individual owners. Business-owned light vehicles expire June 30; business-owned heavy trucks 8,000+ lbs (or 5,001&ndash;7,999 lbs) expire Dec 31 &mdash; no birthday needed either way.</span></span></label>
        <input type="date" id="bday">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Title</legend>
    <div class="row">
      <div class="field">
        <label for="titletype">Title type</label>
        <select id="titletype">
          <option value="instate">In-state transfer (has FL title)</option>
          <option value="oos">Out-of-state (first FL title)</option>
        </select>
      </div>
      <div class="field checkline">
        <input type="checkbox" id="lien">
        <label for="lien" style="font-size:0.85rem;">Lien on vehicle (+$2)</label>
      </div>
      <div class="field checkline">
        <input type="checkbox" id="fast">
        <label for="fast" style="font-size:0.85rem;">Fast title (+$10)</label>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Registration</legend>
    <div class="row">
      <div class="field">
        <label for="scenario">Scenario</label>
        <select id="scenario">
          <option value="newplate">New Plate (no existing FL plate/record)</option>
          <option value="transfer">Transfer</option>
          <option value="titleOnly">Title Only (no registration)</option>
        </select>
      </div>
    </div>
    <div class="row" id="transferToggles">
      <div class="field checkline">
        <input type="checkbox" id="renewReq">
        <label for="renewReq" style="font-size:0.85rem;">Renew registration (extend to a fresh period)</label>
      </div>
      <div class="field checkline">
        <input type="checkbox" id="replaceReq">
        <label for="replaceReq" style="font-size:0.85rem;">Replacement plate required</label>
      </div>
      <div class="field" id="replaceReasonField">
        <label for="replaceReason">Reason</label>
        <select id="replaceReason">
          <option value="surrendered">Surrendered &mdash; on file, no $28</option>
          <option value="lost">Lost or damaged &mdash; $28 applies</option>
        </select>
      </div>
    </div>
    <div class="row" id="transferFields">
      <div class="field">
        <label for="prevNetwt">Previous vehicle's net weight, lbs<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">Leave blank if the plate is coming from file/surrender with no prior vehicle to compare. Matters for a straight Transfer AND for Transfer+Renew if the class is changing.</span></span></label>
        <input type="number" id="prevNetwt" placeholder="e.g. 4200">
      </div>
      <div class="field">
        <label for="prevGvw">Previous vehicle's GVW, lbs</label>
        <input type="number" id="prevGvw" placeholder="only if over 5,000 lbs net">
      </div>
      <div class="field">
        <label for="knownExp">Known current plate expiration (if visible on file)<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">Used for the old-registration credit whenever entered, regardless of whether the cycle type changed. Also used directly for the new vehicle's own period, but only when old and new share the same cycle type — if the cycle type changed, that part is computed independently instead.</span></span></label>
        <input type="date" id="knownExp">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="miscfee">Misc. stacked state fees<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">HEAVY VEHICLES ONLY. Auto-fills to the confirmed real value for the 8,000–9,999 ($9.10, from a real 8,600 GVW deal) and 10,000–14,999 ($21.60, from two real deals in that bracket) GVW brackets. For LIGHT vehicles this is ignored entirely — the small program fees are already bundled into the confirmed weight-tier rate, not a separate charge (per FHWA's historical breakdown of FL's fee structure).</span></span></label>
        <input type="number" id="miscfee" step="0.01" placeholder="auto-fills once GVW is entered">
      </div>
      <div class="field">
        <label for="countyfee">County fee<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">Confirmed flat $3.00 on every real registration document seen so far, regardless of scenario or weight class.</span></span></label>
        <input type="number" id="countyfee" step="0.01" value="3.00">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Processing</legend>
    <div class="row">
      <div class="field">
        <label for="saledate">Processing date (est.)<span class="info-wrap"><span class="info-icon">i</span><span class="info-tooltip">Use the date this will actually be FILED with the state — not the sale date. Confirmed on a real deal: sold 8/6, filed by Sunstate 9/2 (27-day gap), and the state's proration matched the filing date, not the sale date. If you don't know the exact filing date yet, estimate based on Sunstate's typical turnaround.</span></span></label>
        <input type="date" id="saledate">
      </div>
    </div>
  </fieldset>

  <div class="result">
    <div class="result-head"><span>Estimate</span><span id="classBadge">&mdash;</span></div>
    <div class="result-body" id="resultBody">
      <div class="line"><span>Fill in the fields above</span><span>&mdash;</span></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// Light vehicle net-weight tiers. Only the top tier is confirmed against
// real data (a real 4,365 lb light vehicle deal: Reg Tax $71.10 - $28 plate = $43.10 base,
// not the $46.10 originally pulled from a published schedule). The lower two
// tiers remain UNCONFIRMED \u2014 no real data tested against them yet.
const lightRegTable = [
  {max:2499, fee:28.10},   // UNCONFIRMED
  {max:3499, fee:36.10},   // UNCONFIRMED
  {max:Infinity, fee:43.10} // CONFIRMED via a real deal (4,365 lbs)
];
const heavyGvwTable = [
  {max:5999, fee:60.75},
  {max:7999, fee:87.75},
  {max:9999, fee:103.00},
  {max:14999, fee:118.00},
  {max:19999, fee:177.00},
  {max:25999, fee:251.00},
  {max:34999, fee:324.00},
  {max:43999, fee:405.00},
  {max:54999, fee:773.00},
  {max:61999, fee:916.00},
  {max:71999, fee:1080.00},
  {max:Infinity, fee:1322.00}
];

// Misc. stacked state fees, confirmed per GVW bracket from real deals. Only
// two brackets confirmed so far \u2014 everything else returns null (unconfirmed).
function miscFeeForGvw(gvw){
  if(gvw >= 8000 && gvw <= 9999) return 9.10;   // real 8,600 GVW deal, confirmed exactly
  if(gvw >= 10000 && gvw <= 14999) return 21.60; // two real deals in this bracket, confirmed
  return null;
}

function lookup(table, value){
  for(const row of table){ if(value <= row.max) return row.fee; }
  return table[table.length-1].fee;
}

// Determines the registration cycle type ('birthday' | 'dec31' | 'june30') for
// a given vehicle + owner. Same rules used for both old and new vehicle so
// they can be compared directly.
function cycleType(netWeight, gvw, ownerType){
  const heavy = netWeight > 5000;
  if(!heavy){
    return ownerType === 'business' ? 'june30' : 'birthday';
  }
  if(gvw != null && !isNaN(gvw) && gvw <= 7999 && ownerType === 'individual') return 'birthday';
  return 'dec31';
}

function monthsToDec31(saleDate){
  const m = saleDate.getMonth()+1; // 1-12
  return Math.max(12 - m, 0) || 1; // never show 0, minimum 1 month charged
}

// Real DMV rule (confirmed by desk experience + a real deal): the
// nearest upcoming birthday is used UNLESS it's 60 days or less away, in
// which case the system skips to the FOLLOWING year's occurrence instead
// (a New Tag gets pushed a year out; a Transfer effectively gets renewed).
// Returns {months, skipped, daysToNear} so callers can show why.
function birthdayCycleResult(saleDate, bday){
  if(!bday) return {months: null, skipped: null, daysToNear: null, targetDate: null};
  let near = new Date(saleDate.getFullYear(), bday.getMonth(), bday.getDate());
  if(near <= saleDate) near.setFullYear(near.getFullYear()+1);
  const daysToNear = Math.round((near - saleDate) / 86400000);
  const skipped = daysToNear <= 60;
  let target = near;
  if(skipped){
    target = new Date(near);
    target.setFullYear(target.getFullYear()+1);
  }
  let months = (target.getFullYear()-saleDate.getFullYear())*12 + (target.getMonth()-saleDate.getMonth());
  months = Math.max(months, 1);
  return {months, skipped, daysToNear, targetDate: target};
}

// Legacy simple version, still used for June 30 (business light vehicles)
// where no 60-day rule has been described \u2014 only birthdays skip.
function monthsToNextBirthday(saleDate, bday){
  if(!bday) return 12;
  let next = new Date(saleDate.getFullYear(), bday.getMonth(), bday.getDate());
  if(next <= saleDate) next.setFullYear(next.getFullYear()+1);
  let months = (next.getFullYear()-saleDate.getFullYear())*12 + (next.getMonth()-saleDate.getMonth());
  return Math.max(months, 1);
}

function fmt(n){ return '$' + n.toFixed(2); }
function round2(n){ return Math.round(n * 100) / 100; }
function fmtDate(d){
  if(!d) return null;
  return d.toLocaleDateString('en-US', {year:'numeric', month:'2-digit', day:'2-digit'});
}
function addMonths(date, n){
  const d = new Date(date);
  d.setMonth(d.getMonth()+n);
  return d;
}
function expirationLineHtml(finalExpDate, oldExpDate, reasonIfChanged){
  if(!finalExpDate){
    return `<div class="line total" style="color:var(--warn);font-size:0.95rem;"><span>Expiration date: unknown \u2014 enter owner birthday</span><span></span></div>`;
  }
  const newStr = fmtDate(finalExpDate);
  if(oldExpDate){
    const same = finalExpDate.getTime() === oldExpDate.getTime();
    if(same){
      return `<div class="line total" style="font-size:0.95rem;"><span><strong>Expiration: ${newStr}</strong> (unchanged from existing tag)</span><span></span></div>`;
    }
    return `<div class="line total" style="font-size:0.95rem;"><span><strong>Expiration: ${newStr}</strong> (changing from ${fmtDate(oldExpDate)}${reasonIfChanged?' \u2014 '+reasonIfChanged:''})</span><span></span></div>`;
  }
  return `<div class="line total" style="font-size:0.95rem;"><span><strong>Expiration: ${newStr}</strong></span><span></span></div>`;
}

function sunstateLineHtml(grandTotal){
  if(!$('includeSunstate').checked) return '';
  const withSunstate = round2(grandTotal + 10.00);
  return `<div class="line sub" style="margin-top:6px;"><span>+ Sunstate service fee (every deal)</span><span>+$10.00</span></div>`
       + `<div class="line total"><span>TOTAL INCL. SUNSTATE FEE</span><span>${fmt(withSunstate)}</span></div>`;
}

function recalc(){
  const netwt = parseFloat($('netwt').value);
  const gvw = parseFloat($('gvw').value);
  const ownertype = $('ownertype').value;
  const saleDateVal = $('saledate').value;
  const bdayVal = $('bday').value;
  const titletypeSel = $('titletype').value;
  const lien = $('lien').checked;
  const fast = $('fast').checked;
  const scenario = $('scenario').value; // newplate | transfer | titleOnly
  const renewReq = $('renewReq').checked;
  const replaceReq = $('replaceReq').checked;
  const replaceReason = $('replaceReason').value; // surrendered | lost
  const miscFee = parseFloat($('miscfee').value) || 0;
  const countyFee = parseFloat($('countyfee').value) || 0;

  updateVisibility();

  const body = $('resultBody');
  const badge = $('classBadge');

  if(!netwt || !saleDateVal){
    body.innerHTML = '<div class="line"><span>Enter net weight and processing date to calculate</span><span>&mdash;</span></div>';
    badge.textContent = '\u2014';
    return;
  }

  const saleDate = new Date(saleDateVal + 'T00:00:00');
  const isHeavy = netwt > 5000;
  badge.textContent = isHeavy ? 'HEAVY \u00b7 Class 41' : 'LIGHT \u00b7 Class 31';

  // --- Title fee ---
  // Base reverted to $75.75, the Pinellas Tax Collector's published rate (a
  // direct government source). The $75.25 used earlier was reverse-engineered
  // from an ADD screenshot's own itemization \u2014 but ABT files through
  // Sunstate, not ADD, and Sunstate's real invoices bundle title costs
  // differently ($73.00 Title Fee + $4.75 Agency Fee on one real deal, neither
  // matching ADD's $47/$21/$4.25 breakdown). No confirmed reason to trust
  // ADD's specific split over the published government number for ABT's
  // actual vendor. The confirmed +$10 out-of-state premium (Seminole County
  // chart, consistent across service tiers) still applies on top.
  const useOOS = titletypeSel === 'oos';
  let titleBase = 75.75 + (useOOS ? 10 : 0);
  let titleFee = round2(titleBase + (lien?2:0) + (fast?10:0));

  let html = '';
  html += `<div class="line"><span>Title \u2014 ${useOOS?'out-of-state':'in-state transfer'}</span><span>${fmt(titleBase)}</span></div>`;
  if(lien) html += `<div class="line sub"><span>+ Lien recording</span><span>+$2.00</span></div>`;
  if(fast) html += `<div class="line sub"><span>+ Fast title</span><span>+$10.00</span></div>`;
  html += `<div class="line"><span>Title subtotal</span><span>${fmt(titleFee)}</span></div>`;

  // --- Title Only: stop here, no registration component ---
  if(scenario === 'titleOnly'){
    html += `<div class="line total"><span>ESTIMATED TOTAL</span><span>${fmt(titleFee)}</span></div>`;
    html += sunstateLineHtml(titleFee);
    html += `<div class="flag ok">Title Only \u2014 no registration, plate, or $225 fee involved.</div>`;
    body.innerHTML = html;
    return;
  }

  // --- Registration cycle, from the NEW vehicle's classification. Applies
  // regardless of scenario: a plate moving to a vehicle whose classification
  // requires a different cycle gets reassigned (FLHSMV RS-05: "a new validation
  // decal is required anytime an expiration date is being changed"). The old
  // plate's prior cycle is not preserved.
  let months, cycleNote, cycleOk = true, newExpDate = null, cycleReason = '';
  if(isHeavy){
    const birthdayCarveout = (gvw <= 7999 && ownertype === 'individual');
    if(birthdayCarveout){
      const bday = bdayVal ? new Date(bdayVal + 'T00:00:00') : null;
      const bres = birthdayCycleResult(saleDate, bday);
      months = bres.months;
      cycleOk = !!bday;
      newExpDate = bres.targetDate;
      cycleReason = 'GVW is 7,999 lbs or less and the owner is an individual, so it follows the owner\'s birthday cycle';
      if(bday){
        cycleNote = bres.skipped
          ? `Expires owner's birthday \u2014 GVW 7,999 or less, individual owner. Birthday is only ${bres.daysToNear} days out (\u226460), so it rolls to next year's occurrence`
          : "Expires owner's birthday \u2014 GVW 7,999 or less, individual owner";
      } else {
        cycleNote = "Expires owner's birthday \u2014 enter birthday for accurate proration";
      }
    } else {
      months = monthsToDec31(saleDate);
      newExpDate = new Date(saleDate.getFullYear(), 11, 31);
      cycleReason = ownertype==='business' ? 'business-owned heavy vehicles always follow the Dec 31 cycle' : 'GVW is 8,000 lbs or more, which forces the Dec 31 cycle regardless of individual ownership';
      cycleNote = 'Expires Dec 31 \u2014 ' + (ownertype==='business' ? 'business owned' : 'GVW 8,000+ lbs forces Dec 31 regardless of individual ownership');
    }
  } else {
    if(ownertype === 'business'){
      const juneBday = new Date(2000,5,30);
      let juneTarget = new Date(saleDate.getFullYear(), 5, 30);
      if(juneTarget <= saleDate) juneTarget.setFullYear(juneTarget.getFullYear()+1);
      months = monthsToNextBirthday(saleDate, juneBday);
      newExpDate = juneTarget;
      cycleReason = 'business-owned light vehicles always follow the June 30 cycle';
      cycleNote = 'Company-owned light vehicle \u2014 expires June 30';
      cycleOk = true;
    } else {
      const bday = bdayVal ? new Date(bdayVal + 'T00:00:00') : null;
      const bres = birthdayCycleResult(saleDate, bday);
      months = bres.months;
      cycleOk = !!bday;
      newExpDate = bres.targetDate;
      cycleReason = 'light vehicles owned by an individual follow the owner\'s birthday cycle';
      if(bday){
        cycleNote = bres.skipped
          ? `Expires owner's birthday \u2014 only ${bres.daysToNear} days out (\u226460), so it rolls to next year's occurrence`
          : "Expires owner's birthday";
      } else {
        cycleNote = "Expires owner's birthday \u2014 enter birthday for accurate proration";
      }
    }
  }

  if(!gvw && isHeavy){
    html += `<div class="line" style="margin-top:8px;"><span>Enter GVW to determine the vehicle's registration bracket</span><span>&mdash;</span></div>`;
    body.innerHTML = html;
    return;
  }
  const newAnnual = isHeavy ? lookup(heavyGvwTable, gvw) : lookup(lightRegTable, netwt);

  // --- New Plate: no plate/record on file. Full prorated registration, $28
  // plate, $225 initial fee (light vehicles only \u2014 heavy trucks are exempt).
  if(scenario === 'newplate'){
    const regProrated = round2(newAnnual * (months/12));
    const plateFee = 28.00;
    const initFee = isHeavy ? 0 : 225.00;
    // Light vehicles: the small program fees (Air Pollution, LERSTF, service
    // charge, etc.) are already bundled into the confirmed weight-tier
    // number, unlike heavy trucks where they're broken out separately. Don't
    // double-count them if something's entered in the misc field.
    const effMiscFee = isHeavy ? miscFee : 0;
    const regTotal = round2(regProrated + plateFee + initFee + effMiscFee + countyFee);
    const grandTotal = round2(titleFee + regTotal);

    html += `<div class="line" style="margin-top:8px;"><span>Registration \u2014 ${isHeavy? (gvw+' lb GVW bracket'):(netwt+' lb net weight tier')}</span><span>${fmt(newAnnual)}/yr</span></div>`;
    const monthlyRate = round2(newAnnual/12);
    html += `<div class="line sub"><span>${fmt(newAnnual)} \u00f7 12 = ${fmt(monthlyRate)}/mo</span><span></span></div>`;
    html += `<div class="line sub"><span>\u00d7 ${months} mo. (${cycleNote})</span><span>${fmt(regProrated)}</span></div>`;
    html += `<div class="line sub"><span>+ New plate</span><span>+$28.00</span></div>`;
    if(!isHeavy && miscFee) html += `<div class="line sub" style="color:var(--warn);"><span>\u26a0 Misc. fee ignored \u2014 already bundled into the light-vehicle weight-tier rate above, not a separate charge</span><span>&mdash;</span></div>`;
    else if(effMiscFee) html += `<div class="line sub"><span>+ Misc. stacked state fees</span><span>+${fmt(effMiscFee)}</span></div>`;
    if(miscFee && isHeavy && miscFeeForGvw(gvw) == null) html += `<div class="line sub" style="color:var(--warn);"><span>\u26a0 This figure isn't confirmed for this GVW bracket \u2014 only 8,000\u20139,999 and 10,000\u201314,999 have real data. Verify before quoting.</span><span>&mdash;</span></div>`;
    const regTaxCardEquiv = round2(regProrated + plateFee + effMiscFee);
    html += `<div class="line"><span>Total Registration Tax (should match "Reg. Tax" on the card)</span><span>${fmt(regTaxCardEquiv)}</span></div>`;
    if(initFee) html += `<div class="line sub"><span>+ Initial Registration Fee (light, no plate on file)</span><span>+$225.00</span></div>`;
    if(countyFee) html += `<div class="line sub"><span>+ County fee</span><span>+${fmt(countyFee)}</span></div>`;
    html += `<div class="line"><span>Registration subtotal</span><span>${fmt(regTotal)}</span></div>`;
    html += `<div class="line total"><span>ESTIMATED TOTAL</span><span>${fmt(grandTotal)}</span></div>`;
    html += sunstateLineHtml(grandTotal);
    if(!cycleOk){
      html += `<div class="flag">Enter owner birthday for a real proration \u2014 currently assuming a full 12 months, which likely overstates this estimate.</div>`;
    } else {
      html += `<div class="flag ok">${isHeavy ? 'Heavy truck \u2014 $225 fee never applies.' : 'Light vehicle, no plate on file \u2014 $225 fee applies.'}</div>`;
    }
    body.innerHTML = expirationLineHtml(newExpDate, null, null) + html;
    return;
  }

  // --- Transfer: a plate/record already exists, so $225 never applies here.
  const plateFee = replaceReq && replaceReason === 'lost' ? 28.00 : 0;
  const transferFee = 4.50;

  const prevNetwtVal = parseFloat($('prevNetwt').value);
  const prevGvwVal = parseFloat($('prevGvw').value);

  const newCycle = cycleType(netwt, gvw, ownertype);
  let oldCycleKnown = !isNaN(prevNetwtVal);
  let oldCycle = oldCycleKnown ? cycleType(prevNetwtVal, prevGvwVal, ownertype) : null;
  const sameCycleType = oldCycleKnown && oldCycle === newCycle;

  let prevAnnualVal = NaN, prevSource = '';
  if(!isNaN(prevNetwtVal)){
    const prevIsHeavy = prevNetwtVal > 5000;
    if(prevIsHeavy){
      if(!isNaN(prevGvwVal)){ prevAnnualVal = lookup(heavyGvwTable, prevGvwVal); prevSource = `from ${prevGvwVal} lb GVW`; }
    } else { prevAnnualVal = lookup(lightRegTable, prevNetwtVal); prevSource = `from ${prevNetwtVal} lb net weight`; }
  }

  html += `<div class="line" style="margin-top:8px;"><span>Plate transfer fee (FL Stat. 320.0609)</span><span>${fmt(transferFee)}</span></div>`;

  let regKnown = false, regCore = 0, finalExpDate = null, changeReason = '', oldExpDateForCompare = null;

  if(sameCycleType){
    // CYCLE TYPE UNCHANGED: one continuous period, no reassignment. Honor a
    // known-expiration override (handles biennial prepayment), then just
    // true-up the delta between old and new class for the remaining months.
    const knownExpVal = $('knownExp').value;
    if(knownExpVal){
      const knownExp = new Date(knownExpVal + 'T00:00:00');
      let overrideMonths = (knownExp.getFullYear()-saleDate.getFullYear())*12 + (knownExp.getMonth()-saleDate.getMonth());
      months = Math.max(overrideMonths, 1);
      cycleNote = 'known expiration on file (same cycle type confirmed, override applied)';
      cycleOk = true;
    }
    oldExpDateForCompare = knownExpVal ? new Date(knownExpVal + 'T00:00:00') : addMonths(saleDate, months);
    finalExpDate = renewReq ? addMonths(oldExpDateForCompare, 12) : oldExpDateForCompare;
    changeReason = renewReq ? 'the registration was renewed, extending the expiration by a year' : '';
    const monthsThisPeriod = months + (renewReq ? 12 : 0);
    if(!isNaN(prevAnnualVal) && cycleOk){
      const annualDelta = Math.max(newAnnual - prevAnnualVal, 0);
      const monthlyDelta = round2(annualDelta/12);
      regCore = round2(monthlyDelta * monthsThisPeriod);
      regKnown = true;
      html += `<div class="line sub"><span>Same cycle type \u2014 true-up only: ($${newAnnual.toFixed(2)} \u2212 $${prevAnnualVal.toFixed(2)}) \u00f7 12 = ${fmt(monthlyDelta)}/mo (${prevSource})</span><span></span></div>`;
      html += `<div class="line sub"><span>\u00d7 ${monthsThisPeriod} mo.</span><span>${fmt(regCore)}</span></div>`;
      if(newAnnual <= prevAnnualVal) html += `<div class="line sub"><span>New class same or lower \u2014 no true-up owed</span><span>&mdash;</span></div>`;
    } else if(!cycleOk){
      html += `<div class="line sub"><span>Enter owner birthday to determine the cycle before the true-up can be calculated</span><span>&mdash;</span></div>`;
    } else {
      html += `<div class="line sub"><span>Enter previous vehicle's weight (or annual fee) for the true-up</span><span>&mdash;</span></div>`;
    }
  } else {
    // CYCLE TYPE CHANGED (or unknown): confirmed formula, verified to the
    // penny against two real ADD transactions (a Transfer and its matching
    // Transfer+Renew) \u2014 charge the FULL new-class rate for the months the
    // new registration covers, then credit back the OLD class's unused
    // coverage through ITS OWN cycle's expiration (same owner/birthday).
    // If the new vehicle also lands on the birthday cycle, "months" already
    // reflects the real 60-day-threshold rule computed upstream.
    const monthsNewPortion = months + (renewReq ? 12 : 0);
    const monthlyRateNew = round2(newAnnual/12);
    const newPortionAmt = round2(monthlyRateNew * monthsNewPortion);
    html += `<div class="line sub"><span>$${newAnnual.toFixed(2)} \u00f7 12 = ${fmt(monthlyRateNew)}/mo</span><span></span></div>`;
    html += `<div class="line sub"><span>\u00d7 ${monthsNewPortion} mo. (${cycleNote}${renewReq?' + 12 mo. renewal':''})</span><span>${fmt(newPortionAmt)}</span></div>`;
    finalExpDate = renewReq ? addMonths(newExpDate, 12) : newExpDate;
    changeReason = cycleReason;

    let creditAmt = 0, creditKnown = false;
    const knownExpVal2 = $('knownExp').value;
    if(!isNaN(prevAnnualVal) && knownExpVal2){
      // Known expiration always reflects real remaining time on the OLD
      // registration, regardless of whether the NEW vehicle's cycle type
      // changed \u2014 that's a separate question (which only affects the new
      // portion above). Prefer this real date over any guessed cycle.
      const knownExp2 = new Date(knownExpVal2 + 'T00:00:00');
      oldExpDateForCompare = knownExp2;
      let oldMonths = (knownExp2.getFullYear()-saleDate.getFullYear())*12 + (knownExp2.getMonth()-saleDate.getMonth());
      oldMonths = Math.max(oldMonths, 1);
      creditAmt = round2(prevAnnualVal/12 * oldMonths);
      creditKnown = true;
      html += `<div class="line sub"><span>\u2212 Credit: old $${prevAnnualVal.toFixed(2)}/yr (${prevSource}) \u00f7 12 \u00d7 ${oldMonths} mo. left on old registration (known expiration on file)</span><span>\u2212${fmt(creditAmt)}</span></div>`;
    } else if(!isNaN(prevAnnualVal) && oldCycleKnown){
      let oldMonths = null;
      if(oldCycle === 'dec31'){ oldMonths = monthsToDec31(saleDate); }
      else if(oldCycle === 'june30'){ oldMonths = monthsToNextBirthday(saleDate, new Date(2000,5,30)); }
      else { // birthday
        const bday = bdayVal ? new Date(bdayVal + 'T00:00:00') : null;
        if(bday) oldMonths = monthsToNextBirthday(saleDate, bday);
      }
      if(oldMonths != null){
        creditAmt = round2(prevAnnualVal/12 * oldMonths);
        creditKnown = true;
        html += `<div class="line sub"><span>\u2212 Credit: old $${prevAnnualVal.toFixed(2)}/yr (${prevSource}) \u00f7 12 \u00d7 ${oldMonths} mo. left on old ${oldCycle} cycle (assumed next occurrence \u2014 enter known expiration above if you have the real date)</span><span>\u2212${fmt(creditAmt)}</span></div>`;
      } else {
        html += `<div class="line sub"><span>Enter owner birthday to calculate the old-registration credit</span><span>&mdash;</span></div>`;
      }
    } else {
      html += `<div class="line sub"><span>Enter previous vehicle's weight for the old-registration credit</span><span>&mdash;</span></div>`;
    }
    regCore = round2(newPortionAmt - creditAmt);
    regKnown = creditKnown;
  }

  if(plateFee) html += `<div class="line sub"><span>+ Replacement plate (lost/damaged)</span><span>+$28.00</span></div>`;
  else if(replaceReq) html += `<div class="line sub"><span>+ Replacement plate (surrendered, on file)</span><span>$0.00</span></div>`;
  const effMiscFee2 = isHeavy ? miscFee : 0;
  if(!isHeavy && miscFee) html += `<div class="line sub" style="color:var(--warn);"><span>\u26a0 Misc. fee ignored \u2014 already bundled into the light-vehicle weight-tier rate, not a separate charge</span><span>&mdash;</span></div>`;
  else if(effMiscFee2) html += `<div class="line sub"><span>+ Misc. stacked state fees</span><span>+${fmt(effMiscFee2)}</span></div>`;
  if(miscFee && isHeavy && miscFeeForGvw(gvw) == null) html += `<div class="line sub" style="color:var(--warn);"><span>\u26a0 This figure isn't confirmed for this GVW bracket \u2014 only 8,000\u20139,999 and 10,000\u201314,999 have real data. Verify before quoting.</span><span>&mdash;</span></div>`;
  const regTaxCardEquiv2 = round2(transferFee + regCore + plateFee + effMiscFee2);
  html += `<div class="line"><span>Total Registration Tax (should match "Reg. Tax" on the card)</span><span>${fmt(regTaxCardEquiv2)}</span></div>`;
  if(countyFee) html += `<div class="line sub"><span>+ County fee</span><span>+${fmt(countyFee)}</span></div>`;

  const regTotal = round2(transferFee + regCore + plateFee + effMiscFee2 + countyFee);
  const grandTotal = round2(titleFee + regTotal);
  html += `<div class="line"><span>Registration subtotal</span><span>${fmt(regTotal)}</span></div>`;
  html += `<div class="line total"><span>ESTIMATED TOTAL${regKnown?'':' (partial)'}</span><span>${fmt(grandTotal)}</span></div>`;
  html += sunstateLineHtml(grandTotal);
  if(!regKnown){
    html += `<div class="flag">Fill in the previous vehicle's weight${cycleOk?'':' and owner birthday'} for the real total.</div>`;
  } else if(sameCycleType){
    html += `<div class="flag ok">No $225 fee \u2014 a plate is already on file. Same cycle type as before \u2014 simple true-up model (not independently verified against real ADD data yet).</div>`;
  } else {
    html += `<div class="flag ok">No $225 fee \u2014 a plate is already on file. This new-portion-minus-credit formula is confirmed to the penny against real ADD data for both Transfer and Transfer+Renew.</div>`;
  }
  body.innerHTML = expirationLineHtml(finalExpDate, oldExpDateForCompare, changeReason) + html;
}

function updateVisibility(){
  const scenario = $('scenario').value;
  const isTransfer = scenario === 'transfer';
  $('transferToggles').style.display = isTransfer ? 'flex' : 'none';
  $('replaceReasonField').style.display = (isTransfer && $('replaceReq').checked) ? 'flex' : 'none';
  $('transferFields').style.display = isTransfer ? 'flex' : 'none';
}

['netwt','gvw','ownertype','saledate','bday','titletype','lien','fast','scenario','renewReq','replaceReq','replaceReason','miscfee','countyfee','prevNetwt','prevGvw','knownExp','includeSunstate'].forEach(id=>{
  $(id).addEventListener('input', recalc);
  $(id).addEventListener('change', recalc);
});

// Auto-fill misc fee to the confirmed value whenever GVW lands in a bracket
// we actually have real data for. Runs after the general listener above.
$('gvw').addEventListener('input', () => {
  const gvw = parseFloat($('gvw').value);
  if(!isNaN(gvw)){
    const confirmed = miscFeeForGvw(gvw);
    if(confirmed != null){ $('miscfee').value = confirmed.toFixed(2); }
  }
  recalc();
});

// Autofill from URL HASH (not query string \u2014 the hash fragment is
// browser-only and never touches the server, so it survives platforms that
// might strip or rewrite query strings on published pages).
// Example URL: worksheet.html#netwt=6011&gvw=10000&ownertype=individual&
// saledate=2026-09-05&titletype=instate&scenario=newplate&lien=1
(function autofillFromURL(){
  const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  const directFieldIds = ['netwt','gvw','saledate','bday','ownertype','titletype',
    'scenario','replaceReason','prevNetwt','prevGvw','knownExp',
    'miscfee','countyfee'];
  const checkboxFieldIds = ['lien','fast','renewReq','replaceReq','includeSunstate'];

  directFieldIds.forEach(id => {
    if(params.has(id)){
      const el = $(id);
      if(el) el.value = params.get(id);
    }
  });
  checkboxFieldIds.forEach(id => {
    if(params.has(id)){
      const el = $(id);
      const v = params.get(id).toLowerCase();
      if(el) el.checked = (v === '1' || v === 'true' || v === 'yes' || v === 'on');
    }
  });

  // Setting .value in code doesn't fire the 'input' event, so the GVW ->
  // misc fee auto-lookup (normally triggered by typing) never runs on its
  // own here. Redo it explicitly, unless the URL already passed its own
  // miscfee value directly (respect that override instead).
  if(params.has('gvw') && !params.has('miscfee')){
    const gvwVal = parseFloat($('gvw').value);
    if(!isNaN(gvwVal)){
      const confirmed = miscFeeForGvw(gvwVal);
      if(confirmed != null){ $('miscfee').value = confirmed.toFixed(2); }
    }
  }
})();

// default sale date to today, only if nothing came in from the URL
if(!$('saledate').value){
  $('saledate').value = new Date().toISOString().slice(0,10);
}
updateVisibility();
recalc();
</script>
</body>
</html>
